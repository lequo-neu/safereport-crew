# OSHA Safety Pays: the average cost of a lost time workers' compensation claim by injury type,
# and the ratio of indirect to direct cost, used by the prevention plan (N13).
#
# Read on 24 November 2026 from https://www.osha.gov/safetypays/estimator-text (the injury type
# table) and https://www.osha.gov/safetypays/background (the sliding scale). OSHA: "The average
# claim cost estimates ... are provided by National Council on Compensation Insurance, Inc. (NCCI)
# ... for policy years 2015-2017." Only the injury types the reports map to are copied here.
#
# Safety Pays computes indirect cost = direct cost x ratio, and total = direct + indirect. Every
# type below has a direct cost of $10,000 or more, so the ratio is 1.1, which is also the ratio
# OSHA's table shows for each of them. OSHA notes the employer always pays the indirect costs; how
# much of the direct cost it pays depends on its insurance.

source = "OSHA Safety Pays, NCCI lost time claims, policy years 2015 to 2017"
url = "https://www.osha.gov/safetypays/estimator-text"
years = "2015 to 2017"

# Direct cost ranges (upper bound in dollars, exclusive) and their indirect cost ratio.
indirect_scale = [[3000, 4.5], [5000, 1.6], [10000, 1.2], [1e12, 1.1]]

# How OSHA's nature of injury titles in the severe injury file map to a Safety Pays type: the
# first pattern that matches the lower case title wins; a title nothing matches is "all other".
nature_map = [
  ["amputat|avulsion|enucleat", "AMPUTATION"],
  ["electrocut|electric shock", "ELECTRIC SHOCK"],
  ["crush", "CRUSHING"],
  ["multiple", "MULTIPLE PHYSICAL INJURIES ONLY"],
  ["fractur", "FRACTURE"],
  ["intracranial|concussion|brain", "CONCUSSION"],
  ["burn|corros|scald", "BURN"],
  ["dislocat", "DISLOCATION"],
  ["heat exhaustion|heat stroke|prostration|effects of heat", "HEAT PROSTRATION"],
  ["hernia", "HERNIA"],
  ["tear|strain|sprain", "STRAIN"],
  ["puncture|gunshot", "PUNCTURE"],
  ["cut|lacerat|open wound|abrasion", "LACERATION"],
  ["bruise|contusion", "CONTUSION"],
  ["asphyx|suffoc|drown", "ASPHYXIATION"],
  ["poison|toxic", "POISONING - GENERAL (NOT OD OR CUMULATIVE INJURY)"],
  ["respiratory", "RESPIRATORY DISORDERS (GASES, FUMES, CHEMICALS, ETC.)"],
  ["myocardial|heart attack", "MYOCARDIAL INFARCTION (HEART ATTACK)"],
  ["inflammation|swelling", "INFLAMMATION"],
]
fallback = "ALL OTHER SPECIFIC INJURIES, NOC"

