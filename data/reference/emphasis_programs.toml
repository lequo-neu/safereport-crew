[[documents]]
citation = "CPL 03-00-025"
title = "National Emphasis Program on Falls"
date = "2023-05-01"
url = "https://www.osha.gov/enforcement/directives/cpl-03-00-025"
industries = ["23"]
triggers = ['\b(fell|falls?|falling)\s+(\w+\s+){0,4}(from|off)\b', 'fall to (a )?lower level', '\bfell\b.{0,40}\b\d+\s*(feet|foot|ft)\b']
anywhere_triggers = ['(?=.*\b(fell|falls?|falling)\b)(?=.*(roof ?top|rooftop|on (a|the) roof|utility line|power line|cable line|arborist|tree trimming|trimming (a )?tree|holiday light|billboard|road sign|power ?wash|pressure ?wash|gutter|chimney|window clean|communication tower|cell tower))']
verified = true
scope_note = "Section II of the directive: every construction fall from height, and outside construction only ten activities (roof top work, utility lines, tree trimming, holiday lights, road signs and billboards, power washing buildings, gutters, chimneys, windows, communication towers). Other work at height needs area office approval, so it is not Category 1 here. II.A covers 'all construction inspections related to falls' and the directive never names a NAICS code, so construction is the work, not the employer's code: a staffing agency (NAICS 5613) whose worker fell while doing construction work is covered (issue #30). Construction work is 'construction, alteration, and/or repair' (29 CFR 1910.12(b)); the evidence below names only work that is clearly that, and painting, installing lights or fixtures and work at an unnamed job site stay out because they are as often maintenance."
# Issue #30. Staffing agencies (NAICS 5613) place workers in every industry, so their code says
# nothing about the work. For them the program applies when the narrative names construction
# work (one of work_evidence) and one of the fall triggers above matches. OSHA's own event title
# "struck by ... falling object" means the thing fell, not the worker, so it vetoes the match;
# so does a narrative where something fell onto the worker (a pasted report has no event title).
work_industries = ["5613"]
work_label = "construction work"
work_evidence = [
  '\bunder construction\b|\bbeing (built|constructed|framed|renovated|remodell?ed)\b',
  '\bconstruction (site|project|job|jobsite|work|zone|area|crew|worker|laborer|labou?rer)s?\b',
  '\b(new|commercial|residential|building|home|house|road|highway|bridge) construction\b',
  '\bscaffold',
  '\broofing\b|\broofers?\b|\bre-?roof|\bshingl(e|es|ing)\b|\bdrip edge\b|\broof (deck|decking|panels?|sheathing|truss(es)?|eaves?)\b',
  '\bframing\b|\bframers?\b|\b(roof|floor) truss(es)?\b|\bsheathing\b',
  '\b(hang|hanging|hung|install\w*) (the |some )?(dry ?wall|sheet ?rock|siding|insulation|trusses|joists)\b|\blaying (down )?insulation\b',
  '\bstructural steel\b|\bsteel erect|\biron ?work|\brebar\b|\bconcrete forms?\b|\bformwork\b|\b(pour|pouring|placing) concrete\b',
  '\bmasonry\b|\bbrick ?lay|\bblock ?lay',
  '\bdemoli(tion|sh)|\brenovat|\bremodel',
  '\bexcavat|\btrench',
]
work_exclusions = [
  'struck by (\w+ )?(object )?falling|falling object|object falling',
  '\b(fell|falling|dropped) (\w+ ){0,8}?(on|onto|upon) (him|them|her[.,;]|the (employee|worker|laborer)s?\b|an? (employee|worker|laborer)\b)',
]
text = """Falls while working at heights: in construction, any fall to a lower level; outside construction, falls during roof top work, utility line work, tree trimming, holiday light installation, sign and billboard maintenance, power washing, gutter, chimney and window cleaning, and communication towers."""

[[documents]]
citation = "CPL 03-00-026"
title = "National Emphasis Program on Warehousing and Distribution Center Operations"
date = "2026-07-31"
url = "https://www.osha.gov/enforcement/directives/cpl-03-00-026-0"
industries = ["491110", "492110", "492210", "493110", "493120", "493130", "493190"]
triggers = ['forklift|fork lift|powered industrial|pallet jack|order picker|reach truck|tugger', 'struck|caught|pinch|crush|conveyor', 'slip|trip|fell|fall', 'lift(ing|ed)?\b|carry|overexert|strain', 'heat (stress|stroke|exhaustion|illness|related)|dehydrat', 'fire|burn', 'rack|pallet|load|dock|trailer|box|package|stack']
verified = true
scope_note = "Read from the directive on 2026-11-19, and its scope for 491110 again on 2026-11-28 (issue #26, the directive signed 2026-07-06, effective 2026-07-31): Table 2 NAICS codes (postal processing and distribution centers, couriers, local delivery, warehousing). Triggers follow the hazards the directive lists: struck by, caught in, slips, trips and falls, powered industrial vehicles, material handling and storage, heat, ergonomics and fire. For 491110, Table 2 reads 'Postal Service (Processing & Distribution Centers only)'; XII.B.3 says the CSHO must not inspect under the NEP if 'the establishment is a post office location that is not a processing and distribution center'; XII.A says 'Inspections under this NEP do not include postal or package transportation/delivery to residences and businesses.' So a 491110 report forces an inspection only when it names a processing or distribution facility and does not describe delivery or a retail counter; a report that shows neither, or both, only raises the priority."
# Issue #26. The facility words are read from the narrative and the employer's name (OSHA's file
# often names the plant: "U.S. Postal Service - Oakland P&DC"); the delivery and retail words from
# the narrative only, because "US Post Office" is a common way to write any USPS employer. Written
# after reading 491110 reports outside the 2025 holdout and the answer key (all years, so the
# counts in eval/results/postal_scope.json are development counts, not a test).
scope_industries = ["491110"]
scope_label = "postal processing and distribution center"
scope_evidence = [
  '\bprocess(ing)? (and |& ?)?distribution (center|centre|facility|plant)',
  '\b[a-z]{0,4}p ?& ?dc\b|\b[a-z]{0,4}(n?pdc|ndc)\b',
  '\b(network|national|regional) distribution (center|centre|facility)',
  '\b(mail|postal|package|parcel) (processing|distribution) (center|centre|facility|plant)',
  '\bprocessing (center|centre|plant|facility)\b',
  '\bdistribution (center|centre|facility)\b',
  '\bmail[- ]processing\b',
]
scope_exclusions = [
  '\bdeliver(ing|ed)? (\w+ ){0,3}?(mail|packages?|parcels?|letters?)\b|\bwhile delivering\b',
  '\b(letter|rural|city|mail|postal) carriers?\b|\bcarrier route\b',
  '\b(on|along) (his|her|their|the|a) (mail |delivery |postal )?route\b',
  '\bmail ?box(es)?\b',
  '\bretail (counter|window|lobby|area|unit|clerk)\b|\b(window|counter|retail) (clerk|associate)\b|\bpost office lobby\b',
]
text = """Hazards in warehouses and distribution centers: powered industrial trucks and forklifts, pallet jacks, material handling and storage, stacked loads, conveyors, loading docks, slips, trips and falls, ergonomic and heat hazards."""

