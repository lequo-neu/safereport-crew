verified = true
scope_note = "Read from the directive on 2026-11-19: it targets chemical and physical health hazards (chemical exposures, noise, heat) in the 18 NAICS codes of Appendix B (17 in 331 plus coke ovens 324199). Programmed inspection goals ended in 2014; complaint and referral inspections there may be expanded. Burns and machine injuries in a foundry are outside it."
