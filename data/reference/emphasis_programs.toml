# OSHA National Emphasis Programs, as listed on https://www.osha.gov/enforcement/directives/nep
# (read 2026-11-19). Names, directive numbers and dates are from that list. The `text` lines are
# our own short summaries. Programs marked `verified = true` take their industries from the
# directive itself (amputations, warehousing and heat, read on 2026-11-19); for the others the
# directive was not read, so their triggers follow the title and `verified = false` says so.
# `industries` holds NAICS prefixes; an empty list means the program is not limited by industry
# as far as we know (primary metals uses 331 from its title, unverified).
# `triggers` are our own regular expressions (case insensitive) that a narrative must match for
# the program to apply; a program with an industry list and no triggers applies to every report
# in those industries. They are deliberately narrow, because a match can force an inspection
# (OSHA's Category 1): a slip on a doormat is not a fall from height.
# A report whose hazard falls under one of these programs meets OSHA's Category 1 criteria.

