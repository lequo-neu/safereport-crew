name: CI

# Checks every pull request to main and every push to main: lint, the offline tests (no API key,
# so no model is ever called or paid) and the config check.
#
# Cost: GitHub-hosted runners are free for public repositories. The job runs only while this
# repository is public, so making it private can never start billed minutes. Ubuntu only; the
# macOS and Windows runs are started by hand (Actions, "Run workflow", full matrix).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Also run on macOS and Windows"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.full_matrix && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline backend, no API keys)
        run: pytest -q
      - name: Check config and answer key
        run: safereport check
