# Models SafeReport Crew may call, and how the router moves between them.
#
# Model IDs were checked on 2026-11-19 against each provider's own model list (see `note`).
# Check them again before any live run: a retired ID is replaced here, with no code change.
# `prices` are US dollars per million tokens (input, output); a model without a confirmed
# price has none, and its cost is reported as unknown rather than guessed. `context_window`
# is left out until it is read from the provider's page.
#
# `prior` is a starting guess of the share of steps the model gets right, by step type. It is
# not a measurement: the evaluation replaces it with measured values, and the trace marks every
# routing choice that still rests on a prior.

[router]
# Accuracy a model must reach on a step before the router trusts it, by case difficulty.
bar = { simple = 0.80, moderate = 0.88, hard = 0.95 }
# Order tried when a call times out, hits a rate limit or gets a server error.
fallback_order = ["claude", "gemini_flash", "gpt_nano", "gemma_local"]
# Below this Intake confidence the step moves up to a stronger model, and the code goes to a person.
min_confidence = 0.70
# When the top two standards score closer than this, the Standards step moves up.
min_retrieval_margin = 0.05
# Tries on one model before moving down the fallback chain, and the wait between them.
retries_per_model = 1
backoff_seconds = 2.0
# A model that failed every retry with an outage is skipped for this long, then tried again.
cooldown_seconds = 60.0

[[models]]
name = "claude"
label = "Claude Sonnet 5.5"
provider = "anthropic"
model_id = "claude-sonnet-5-5"
# Looked up for our earlier course work on 2026-11-03.
prices = [2.00, 10.00]
roles = ["retrieve", "decide"]
prior = { code = 0.90, retrieve = 0.90, decide = 0.92, write = 0.92 }
checked_on = "2026-11-19"
note = "Anthropic's current Sonnet."

